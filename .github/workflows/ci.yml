# Continuous integration for OpenEduLab (B8).
#
# What this does NOT do, on purpose:
#   - it deploys nothing and contacts no production host;
#   - it holds no production credentials. Every `OEL_*` value used here is generated by
#     the test harnesses themselves (a throwaway database, a local-only operator token);
#   - it does not talk to a registry, does not publish, and does not create releases.
#
# Reproducibility: Node is pinned to the version range in package.json `engines`
# (>=22.5 <23 — the `node:sqlite` floor), and dependencies come from package-lock.json via
# `npm ci`. Playwright browsers are installed from the lockfile's Playwright version.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Keep CI quiet about the experimental SQLite warning; it is expected on Node 22.
  NODE_NO_WARNINGS: '1'

jobs:
  checks:
    name: typecheck / lint / unit / api / content / build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.0'
          cache: npm

      # Lockfile is authoritative: `npm ci` fails if package.json and the lockfile disagree.
      - name: Install from lockfile
        run: npm ci

      - name: Typecheck (web)
        run: npm run typecheck

      - name: Typecheck (api src + tests)
        run: npm run typecheck:api

      - name: Lint
        run: npm run lint

      - name: Unit tests (web / experiment host / i18n / contract)
        run: npm run test

      # The retention CLI runs the compiled module, and its test invokes the CLI, so the
      # API build has to exist before the API suite (same order as `npm run check`).
      - name: Build API
        run: npm run build:api

      - name: API tests (auth, authorization, personal data, events, operator channel, retention)
        run: npm run test:api

      - name: Contract + manifest + i18n validation
        run: npm run validate:content

      - name: Build SPA
        run: npm run build

      - name: Smoke against a real server process
        run: npm run smoke:api

  e2e:
    name: browser E2E / backup+restore drill / retention dry-run
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: checks
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.0'
          cache: npm

      - name: Install from lockfile
        run: npm ci

      # Browser downloads were the slowest and least predictable part of this job: on
      # 2026-10-26 a cache-miss run spent ~17 minutes in this step instead of ~40 seconds.
      # The cache key follows the lockfile, so a Playwright upgrade still downloads once.
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      # Four viewports against the real Fastify process serving the real built SPA.
      # `scripts/e2e-server.mjs` creates and deletes its own throwaway SQLite database.
      - name: End-to-end (desktop / mobile / projector / tablet)
        run: npm run test:e2e

      - name: Backup snapshot check (VACUUM INTO + integrity + counts)
        run: npm run check:backup -- --db test-results/e2e/app.sqlite --out test-results/backup.json

      - name: Restore drill (copy back, verify, boot the API on the restored file)
        run: npm run check:restore -- --db test-results/e2e/app.sqlite --out test-results/restore.json

      - name: Retention dry-run (must delete nothing)
        run: npm run retention:dry-run -- --db test-results/e2e/app.sqlite --out test-results/retention.json

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Upload drill reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: drill-reports
          path: |
            test-results/backup.json
            test-results/restore.json
            test-results/retention.json
          retention-days: 7
